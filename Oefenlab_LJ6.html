<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Symbion oefenlab</title><style>body{font:20px Arial;background:#eff5f5;color:#162336;max-width:800px;margin:40px auto;padding:20px}main{background:white;border-radius:20px;padding:30px}button{display:block;background:#171078;color:white;padding:18px;border:0;border-radius:12px;font-size:18px;margin:14px 0;width:100%;text-align:left}#feedback{min-height:70px}small{font-size:15px}</style><main><small>Symbion • Leerjaar 6 • Eerst kiezen, dan bespreken</small><h1 id="title"></h1><p id="q"></p><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next">Volgende vraag</button></main><script>const cards=[["Je vriend vraagt vanaf een nieuw nummer €20. Hij wil dat je niet belt.", "Bellen via het bekende nummer", "Meteen betalen", "Controleer buiten het nieuwe bericht."], ["Je hebt €60. Twee rekeningen zijn €35 en €20.", "Er blijft €5 over", "Er blijft €25 over", "60 − 35 − 20 = 5."], ["AI schrijft dat Sam een heftruckdiploma heeft. Dat klopt niet.", "De zin verwijderen en echte ervaring gebruiken", "De zin bewaren: klinkt professioneel", "AI kan feiten verzinnen. Jij controleert."], ["Je krijgt een intieme foto doorgestuurd.", "Niet verder delen; hulp vragen als er druk is", "Doorsturen omdat iemand hem al gedeeld heeft", "Ontvangen betekent geen toestemming om te delen."], ["Een werkgever vraagt om jouw DigiD-code.", "Stoppen en onafhankelijk contact controleren", "Code geven voor het contract", "DigiD-codes zijn persoonlijk."], ["Een influencer krijgt betaald voor een aanbeveling.", "Het is reclame; zelf voorwaarden controleren", "Het product is daardoor zeker goed", "Een aanbeveling is geen bewijs van kwaliteit."]];let i=0;function show(){document.querySelector('#title').textContent='Vraag '+(i+1)+' van '+cards.length;document.querySelector('#q').textContent=cards[i][0];document.querySelector('#feedback').textContent='';let c=document.querySelector('#choices');c.replaceChildren();let opts=[1,2];if(i%2)opts.reverse();opts.forEach(n=>{let b=document.createElement('button');b.textContent=cards[i][n];b.onclick=()=>{document.querySelector('#feedback').textContent=(n===1?'Goede veilige keuze. ':'Probeer opnieuw. ')+cards[i][3]+' Bespreek: waarom?';};c.append(b);});}document.querySelector('#next').onclick=()=>{i=(i+1)%cards.length;show();};show();</script></html>
